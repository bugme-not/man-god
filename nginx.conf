worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;
    client_max_body_size 0;

    tcp_nodelay on;
    tcp_nopush off;
    sendfile off;
    keepalive_timeout 3600s;

    # Persistent connection pools to eliminate TCP handshake overhead on local backends
    upstream xray_backend {
        server 127.0.0.1:10085;
        keepalive 256;
    }

    upstream ssh_backend {
        server 127.0.0.1:2222;
        keepalive 256;
    }

    upstream sub_backend {
        server 127.0.0.1:8081;
        keepalive 32;
    }

    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "S2w0eVY4bTBRN3pQNjFqWA==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080 default_server reuseport backlog=65535;
        listen [::]:8080 default_server reuseport backlog=65535;
        server_name _;

        http2 on;

        # 1. SSH over WebSocket Proxy (routed to anti_ddos.py via keepalive pool)
        location /cxlvin {
            proxy_pass http://ssh_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            tcp_nodelay on;
        }

        # 2. VLESS over WebSocket Proxy (routed to Xray-core via keepalive pool)
        location /CxlvinVlWS {
            proxy_redirect off;
            proxy_pass http://xray_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            tcp_nodelay on;
        }

        # 3. VLESS xHTTP
        location ^~ /CxlvinVlXH {
            proxy_pass http://127.0.0.1:10009;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # 4. VLESS gRPC
        location ^~ /cxlvinvl-grpc {
            grpc_pass grpc://127.0.0.1:12003;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_socket_keepalive on;
            grpc_buffer_size 32k;
        }

        # 5. Dynamic Subscription Endpoint (routed to sub_server.py via keepalive pool)
        location /sub {
            proxy_pass http://sub_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default Fallback
        location / {
            return 302 https://wtfismyip.com/;
        }
    }
}
