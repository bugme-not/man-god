worker_processes auto; 

events { 
    worker_connections 8192; 
    multi_accept on; 
    use epoll; 
} 

http { 
    client_header_buffer_size 8k; 
    large_client_header_buffers 4 32k; 
    tcp_nodelay on; 
    tcp_nopush off; 
    sendfile off; 
    keepalive_timeout 3600; 

    # Upstream backends matching location pass names
    upstream xray_backend { 
        server 127.0.0.1:10085; 
        keepalive 256; 
    } 
    upstream vless_grpc { 
        server 127.0.0.1:12003; 
        keepalive 256; 
    } 
    upstream vless_xh { 
        server 127.0.0.1:10009; 
        keepalive 256; 
    } 
    upstream ssh_backend { 
        server 127.0.0.1:2222; 
        keepalive 256; 
    } 
    upstream sub_backend { 
        server 127.0.0.1:8081; 
        keepalive 32; 
    } 

    map $http_sec_websocket_key $ws_key { 
        default $http_sec_websocket_key; 
        "" "S2w0eVY4bTBRN3pQNjFqWA=="; 
    } 
    map $http_sec_websocket_version $ws_version { 
        default $http_sec_websocket_version; 
        "" "13"; 
    } 
    map $http_upgrade $connection_upgrade { 
        default upgrade; 
        '' close; 
    } 

    server { 
        listen 8080; 
        server_name _; 

        # 1. SSH over WebSocket Proxy
        location /cxlvin { 
            proxy_pass http://ssh_backend; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection $connection_upgrade; 
            proxy_set_header Sec-WebSocket-Key $ws_key; 
            proxy_set_header Sec-WebSocket-Version $ws_version; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr; 
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
            proxy_read_timeout 86400s; 
            proxy_send_timeout 86400s; 
            proxy_buffering off; 
            proxy_request_buffering off; 
            proxy_socket_keepalive on; 
            tcp_nodelay on; 
        } 

        # 2. VLESS over WebSocket Proxy
        location /CxlvinVlWS { 
            proxy_redirect off; 
            proxy_pass http://xray_backend; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr; 
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
            proxy_read_timeout 86400s; 
            proxy_send_timeout 86400s; 
            proxy_buffering off; 
            proxy_request_buffering off; 
            proxy_socket_keepalive on; 
            tcp_nodelay on; 
        } 

        # 3. VLESS over gRPC Proxy
        location /cxlvinvl-grpc { 
            grpc_pass grpc://vless_grpc; 
            grpc_read_timeout 86400s; 
            grpc_send_timeout 86400s; 
            grpc_buffer_size 512k; 
        } 

        # 4. VLESS over XHTTP Proxy
        location /CxlvinVlXH { 
            proxy_pass http://vless_xh; 
            proxy_http_version 1.1; 
            proxy_set_header Host $host; 
            proxy_read_timeout 86400s; 
            proxy_send_timeout 86400s; 
        } 

        # 5. Dynamic Subscription Endpoint
        location /sub { 
            proxy_pass http://sub_backend; 
            proxy_http_version 1.1; 
            proxy_set_header Connection ""; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr; 
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
            proxy_set_header X-Forwarded-Proto $scheme; 
        } 

        # 6. Default Fallback
        location / { 
            return 302 https://wtfismyip.com/; 
        } 
    } 
}
