worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;
    client_max_body_size 0;

    # Global TCP Low-Latency Tuning
    tcp_nodelay on;      # Disables Nagle's algorithm globally (inherited everywhere)
    tcp_nopush off;      # Off for proxies to prevent packet buffering
    sendfile off;
    keepalive_timeout 3600s;
    keepalive_requests 100000;

    # HTTP/2 High-Throughput / Low-Latency Tuning
    http2_max_concurrent_streams 1000;
    http2_body_preread_size 64k;

    # Upstream Backends (Persistent connection pools for ALL local services)
    upstream xray_ws {
        server 127.0.0.1:10085;
        keepalive 256;
    }

    upstream xray_xh {
        server 127.0.0.1:10009;
        keepalive 256;
    }

    upstream xray_grpc {
        server 127.0.0.1:12003;
        keepalive 256;
    }

    upstream ssh_backend {
        server 127.0.0.1:2222;
        keepalive 256;
    }

    upstream sub_backend {
        server 127.0.0.1:8081;
        keepalive 32;
    }

    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "S2w0eVY4bTBRN3pQNjFqWA==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080 default_server reuseport backlog=65535;
        listen [::]:8080 default_server reuseport backlog=65535;
        server_name _;

        http2 on;

        # 1. SSH over WebSocket
        location /cxlvin {
            proxy_pass http://ssh_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            tcp_nodelay on;
        }

        # 2. VLESS WebSocket
        location /CxlvinVlWS {
            proxy_redirect off;
            proxy_pass http://xray_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            tcp_nodelay on;
        }

        # 3. VLESS xHTTP (Routed via upstream pool)
        location ^~ /CxlvinVlXH {
            proxy_pass http://xray_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            tcp_nodelay on;
        }

        # 4. VLESS gRPC (Routed via upstream pool + reduced buffer size)
        location ^~ /cxlvinvl-grpc {
            grpc_pass grpc://xray_grpc;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_socket_keepalive on;
            grpc_buffer_size 4k;
            tcp_nodelay on;
        }

        # 5. Dynamic Subscription Endpoint
        location /sub {
            proxy_pass http://sub_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default Fallback
        location / {
            return 302 https://wtfismyip.com/;
        }
    }
}
